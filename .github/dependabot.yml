version: 2
updates:
  # Actions do base-actions consumidas via @main: manter os pins em dia aqui
  # (quebra de dependencia em cadeia de suprimentos e o risco de tags moveis).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ['*']
    # Majors quebram o build (tiny-skia 0.12 e symphonia 0.6 exigem migração de render/áudio); atualizar em PR próprio.
    ignore:
      - dependency-name: tiny-skia
        versions: ['>= 0.12']
      - dependency-name: symphonia
        versions: ['>= 0.6']
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'

