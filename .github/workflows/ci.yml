name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  check:
    # Single fast gate: compile the workspace and run the cheap node checks.
    # Heavy suites (cargo test, wasm build, web smoke, android/ios/desktop
    # packaging) run on demand or in the release pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo check --workspace --locked
      - run: node --test scripts/*.test.mjs
      - run: node scripts/file-size.mjs
