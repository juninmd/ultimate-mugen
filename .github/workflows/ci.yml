name: CI
on:
  push: { branches: [master] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  release-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node --test scripts/*.test.mjs
      - run: node scripts/file-size.mjs
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo test --workspace --release
        env: { CARGO_PROFILE_RELEASE_LTO: "off", CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16 }
      - run: cargo run --release -p ume-engine --example mugen_check -- --strict crates/engine/tests/data/chars
        env: { CARGO_PROFILE_RELEASE_LTO: "off", CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16 }
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo build --release --target wasm32-unknown-unknown
  web-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"
      - run: python3 -m pip install --user --break-system-packages "pillow>=11,<13"
      - run: ./scripts/build-web.sh
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/web-smoke.js web/dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo install cargo-apk --version 0.9.6 --locked
      - run: keytool -genkeypair -keystore ci.keystore -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"
      - run: ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" CARGO_APK_RELEASE_KEYSTORE="$PWD/ci.keystore" CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android cargo apk build -p ultimate-mugen --lib --release --target aarch64-linux-android
      - uses: actions/upload-artifact@v7
        with:
          name: ultimate-mugen-android
          path: target/release/apk/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-ios }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo build -p ultimate-mugen --bin ultimate-mugen --release --target aarch64-apple-ios
  desktop:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/master' }}" }
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: ultimate-mugen-${{ matrix.os }}
          path: |
            target/release/ultimate-mugen
            target/release/ultimate-mugen.exe
