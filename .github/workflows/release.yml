name: Release
# Every push to master is planned from its conventional commits (feat -> minor, fix/perf -> patch, ! -> breaking).
# A release is built on 3 OSes, verified against its manifest as a DRAFT, and only then published (which creates the tag).
on:
  push: { branches: [master] }
  workflow_dispatch:
    inputs:
      bump:
        description: Force a bump instead of deriving it from commits (needed for the first release of a non-conventional history)
        type: choice
        options: ["", patch, minor, major]
        default: ""
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
env: { CARGO_INCREMENTAL: 0, CARGO_NET_RETRY: 10 }

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: node --test scripts/*.test.mjs
      - id: plan
        env: { BUMP: "${{ inputs.bump }}", GITHUB_REPOSITORY: "${{ github.repository }}" }
        run: node scripts/release-plan.mjs --github-output --notes-file release-notes.md ${BUMP:+--bump "$BUMP"}
      - if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with: { name: release-notes, path: release-notes.md }

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, exe: ultimate-mugen, pack: tar }
          - { os: windows-latest, platform: windows-x86_64, exe: ultimate-mugen.exe, pack: zip }
          - { os: macos-latest, platform: macos-aarch64, exe: ultimate-mugen, pack: tar }
    runs-on: ${{ matrix.os }}
    env: { UME_RELEASE_VERSION: "${{ needs.plan.outputs.version }}" }
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # never ship a red tree: the same suite as CI, once (Linux leg)
      - if: runner.os == 'Linux'
        run: cargo test --workspace --release --locked
      - run: cargo build --release --locked
      - name: Stamped version must equal the planned tag
        run: |
          got="$(target/release/${{ matrix.exe }} --version)"
          test "$got" = "ultimate-mugen $UME_RELEASE_VERSION" || { echo "stamp mismatch: '$got'"; exit 1; }
      - name: Package
        run: |
          name="ultimate-mugen-v${UME_RELEASE_VERSION}-${{ matrix.platform }}"
          mkdir -p "stage/$name" dist
          cp "target/release/${{ matrix.exe }}" README.md "stage/$name/"
          if [ "${{ matrix.pack }}" = zip ]; then (cd stage && 7z a -tzip "../dist/$name.zip" "$name" >/dev/null); else tar -czf "dist/$name.tar.gz" -C stage "$name"; fi
          raw="dist/ultimate-mugen-v${UME_RELEASE_VERSION}-${{ matrix.platform }}"
          if [ "${{ matrix.pack }}" = zip ]; then raw="$raw.exe"; fi
          cp "target/release/${{ matrix.exe }}" "$raw"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with: { name: "dist-${{ matrix.platform }}", path: dist/*, if-no-files-found: error }

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { path: dist, pattern: "dist-*", merge-multiple: true }
      - uses: actions/download-artifact@v8
        with: { name: release-notes }
      - name: Build manifest
        run: node scripts/release-manifest.mjs --dir dist --version "$VERSION" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: Draft release (idempotent resume)
        run: |
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)"
          if [ "$state" = false ]; then echo "$TAG is already published; nothing to do"; echo SKIP=1 >> "$GITHUB_ENV"; exit 0; fi
          if [ "$state" = none ]; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Ultimate MUGEN $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
      - name: Verify the draft against its manifest
        if: env.SKIP != '1'
        run: |
          mkdir verify
          for i in 1 2 3 4 5; do rm -rf verify/*; gh release download "$TAG" --dir verify && break; [ "$i" = 5 ] && exit 1; sleep $((i * 10)); done
          node scripts/release-manifest.mjs --verify verify/latest.json --dir verify --version "$VERSION" --repo "$GITHUB_REPOSITORY"
      - name: Publish (creates the tag at the planned commit)
        if: env.SKIP != '1'
        run: gh release edit "$TAG" --draft=false --latest
      - name: Health check the public manifest
        if: env.SKIP != '1'
        run: |
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' || true)"
            [ "$live" = "$VERSION" ] && { echo "live manifest = $live"; exit 0; }
            sleep 10
          done
          echo "public manifest is '$live', expected $VERSION. Rollback: gh release delete $TAG --cleanup-tag --yes"; exit 1
