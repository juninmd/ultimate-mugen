[workspace]
members = ["crates/formats", "crates/engine", "crates/netplay", "crates/render", "crates/shell", "crates/market", "crates/charforge", "crates/devtools", "."]
resolver = "2"

[package]
name = "ultimate-mugen"
version = "0.2.0"
edition = "2021"
description = "Ultimate MUGEN — motor de luta 2D moderno em Rust, compatível com personagens M.U.G.E.N"
license = "MIT"

[lib]
name = "ultimate_mugen"
path = "src/android.rs"
crate-type = ["cdylib"]

[[bin]]
name = "ultimate-mugen"
path = "src/main.rs"

[dependencies]
ume-shell = { path = "crates/shell" }
ume-formats = { path = "crates/formats" }
ume-engine = { path = "crates/engine" }
ume-market = { path = "crates/market" }
tiny-skia = "0.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "=0.8.23"
symphonia = { version = "=0.5.5", default-features = false, features = ["ogg", "vorbis", "mp3", "flac", "wav", "pcm", "adpcm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
gilrs = "0.11"
# pinned: newer 3.x releases are younger than the 2-week supply-chain maturity window
ureq = "=3.4.2"
sha2 = "=0.10.9"
ume-netplay = { path = "crates/netplay" }
ggrs = "=0.13.0"
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }

[profile.dev]
debug = "line-tables-only"
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
opt-level = 3
lto = "thin"
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
[profile.web.package.ume-engine]
opt-level = 3
[profile.web.package.ume-formats]
opt-level = 3
[profile.web.package.ume-render]
opt-level = 3
[profile.web.package.tiny-skia]
opt-level = 3
[profile.web.package.tiny-skia-path]
opt-level = 3
[profile.web.package.miniz_oxide]
opt-level = 3
[profile.web.package.png]
opt-level = 3
[profile.web.package.fdeflate]
opt-level = 3
[profile.web.package.simd-adler32]
opt-level = 3

[package.metadata.bundle]
name = "Ultimate MUGEN"
identifier = "dev.ultimatemugen.app"

[package.metadata.android]
package = "dev.ultimatemugen.app"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Ultimate MUGEN"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
orientation = "userLandscape"
