[package]
name = "ume-native"
version = "0.2.0"
edition = "2021"
autotests = false
description = "UMF native fighter compiler for Ultimate MUGEN"
license = "MIT"

[lib]
name = "ume_native"
path = "src/lib.rs"

[dependencies]
ume-engine = { path = "../engine" }
ume-formats = { path = "../formats" }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "it"
path = "tests/it.rs"
