[package]
name = "ume-netplay"
version = "0.2.0"
edition = "2021"
description = "Rollback netplay, sync-test and replays for Ultimate MUGEN"
license = "MIT"

[lib]
name = "ume_netplay"
path = "src/lib.rs"

[dependencies]
ume-engine = { path = "../engine" }
ggrs = { version = "=0.13.0", optional = true }

[features]
default = ["rollback"]
rollback = ["dep:ggrs"]

[dev-dependencies]
ume-formats = { path = "../formats" }
