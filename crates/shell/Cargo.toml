[package]
name = "ume-shell"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
ume-render = { path = "../render" }
wgpu = "30"
winit = "=0.30.13"
fontdue = "0.9"
glam = "0.34"
png = "0.18"
web-time = "1"

[features]
egui = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui = { version = "=0.37.0", optional = true }
egui-wgpu = { version = "=0.37.0", optional = true }
egui-winit = { version = "=0.37.0", default-features = false, optional = true }
pollster = "1.0"
quad-snd = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "=0.30.13", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioParam", "AudioDestinationNode", "GainNode", "BaseAudioContext", "AudioContextState", "AudioScheduledSourceNode", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui = "=0.37.0"
egui-phosphor = "=0.14.0"

[dev-dependencies]
ume-engine = { path = "../engine" }
ume-formats = { path = "../formats" }

[[example]]
name = "egui_overlay"
required-features = ["egui"]

[[example]]
name = "egui_menu"
path = "examples/egui_menu/main.rs"
required-features = ["egui"]
