<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0716" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ultimate MUGEN</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preload" href="ultimate-mugen_bg.wasm?v=__BUILD__" as="fetch" type="application/wasm" crossorigin />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0716; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    canvas { margin: 0; padding: 0; width: 100%; height: 100%; display: block; position: absolute; outline: none; touch-action: none; -moz-user-select: none; user-select: none; }
    #imp { position: fixed; display: none; z-index: 5; opacity: 0; cursor: pointer; overflow: hidden; font-size: 0; }
    #imp input { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
    #boot { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0716; color: #e9e4ff; font: 600 15px system-ui, sans-serif; transition: opacity .25s; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot b { font: 800 28px system-ui, sans-serif; letter-spacing: .08em; color: #22e8ff; }
    #bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #bar i { display: block; height: 100%; width: 0; background: #22e8ff; transition: width .15s; }
    #bar.ind i { width: 30%; transition: none; animation: slide 1.1s ease-in-out infinite alternate; }
    @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
    #fatal { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #0b0716; color: #e9e4ff; font: 600 15px system-ui, sans-serif; }
    #fatal.on { display: flex; }
    #fatal button { border: 0; border-radius: 6px; padding: 10px 22px; background: #22e8ff; color: #0b0716; font: 700 15px system-ui, sans-serif; cursor: pointer; }
    #rot { display: none; }
    #rot.off { display: none; }
    @media (orientation: portrait) and (max-width: 700px) { #rot { display: flex; align-items: center; gap: 8px; position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 6px 6px 6px 12px; border-radius: 999px; background: rgba(11,7,22,.82); color: #e9e4ff; font: 600 12px system-ui; z-index: 9; pointer-events: auto; } #rot button { border: 0; background: none; color: #22e8ff; font: 700 16px system-ui; padding: 2px 8px; cursor: pointer; } }
    @media (prefers-reduced-motion: reduce) { #boot, #boot.done, #bar i { transition: none; } #bar.ind i { animation: none; width: 100%; opacity: .4; } }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="0" aria-label="Ultimate MUGEN"></canvas>
  <label id="imp" aria-label="Import M.U.G.E.N">Import M.U.G.E.N<input id="ume-file" type="file" accept=".zip" multiple /></label>
  <div id="boot"><b>ULTIMATE MUGEN</b><div id="bar" role="progressbar" aria-labelledby="bootmsg" aria-valuemin="0" aria-valuemax="100"><i></i></div><span id="bootmsg" aria-live="polite">Downloading the game…</span></div>
  <div id="fatal" role="alert"><span id="fataltx"></span><button id="fatalbtn" type="button"></button></div>
  <div id="rot" role="status"><span id="rottx"></span><button id="rotx" type="button" aria-label="Close">&times;</button></div>
  <script src="preflight.js"></script>
  <script src="gamepad.js"></script>
  <script src="vpad.js"></script>
  <script src="assets.js"></script>
  <script src="market.js"></script>
  <script type="module">
    const TEXTS = {
      pt: { fatal: 'O jogo parou: faltou memória ou ocorreu um erro interno.', reload: 'Recarregar', download: 'Baixando o jogo…', fail: 'Falha ao carregar', lost: 'Contexto gráfico perdido, recarregando…', rotate: 'Gire o aparelho para jogar na horizontal →', import: 'Importar M.U.G.E.N', close: 'Fechar' },
      es: { fatal: 'El juego se detuvo: se quedó sin memoria o tuvo un error interno.', reload: 'Recargar', download: 'Descargando el juego…', fail: 'Error al cargar', lost: 'Contexto gráfico perdido, recargando…', rotate: 'Gira el dispositivo para jugar en horizontal →', import: 'Importar M.U.G.E.N', close: 'Cerrar' },
      en: { fatal: 'The game stopped: it ran out of memory or hit an internal error.', reload: 'Reload', download: 'Downloading the game…', fail: 'Failed to load', lost: 'Graphics context lost, reloading…', rotate: 'Rotate your device to play in landscape →', import: 'Import M.U.G.E.N', close: 'Close' },
    };
    const tx = TEXTS[(navigator.language || 'en').slice(0, 2)] || TEXTS.en;
    document.documentElement.lang = (navigator.language || 'en');
    document.getElementById('bootmsg').textContent = tx.download;
    const rot = document.getElementById('rot');
    let rotSeen = false;
    try { rotSeen = sessionStorage.getItem('ume-rot-dismissed') === '1'; } catch (e) {}
    document.getElementById('rottx').textContent = tx.rotate;
    const dismissRot = () => { rot.classList.add('off'); try { sessionStorage.setItem('ume-rot-dismissed', '1'); } catch (e) {} };
    if (rotSeen) rot.classList.add('off');
    const rotateClose = document.getElementById('rotx');
    rotateClose.setAttribute('aria-label', tx.close);
    rotateClose.addEventListener('click', dismissRot);
    document.getElementById('imp').setAttribute('aria-label', tx.import);
    const boot = document.getElementById('boot'), barBox = document.getElementById('bar'), bar = barBox.querySelector('i'), msg = document.getElementById('bootmsg');
    const setProgress = (pct) => { bar.style.width = pct + '%'; barBox.setAttribute('aria-valuenow', String(Math.round(pct))); };
    let hideTimer, removeBootTimer;
    const hide = () => { boot.classList.add('done'); removeBootTimer = setTimeout(() => boot.remove(), 400); };
    async function load() {
      const url = new URL('./ultimate-mugen_bg.wasm?v=__BUILD__', import.meta.url);
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      if (!res.body || typeof TransformStream !== 'function') return res;
      const encoded = !!res.headers.get('content-encoding');
      const total = encoded ? 0 : +res.headers.get('content-length') || 0;
      if (total) setProgress(0);
      else barBox.classList.add('ind');
      let got = 0;
      const body = res.body.pipeThrough(new TransformStream({ transform(chunk, ctl) { got += chunk.length; if (total) setProgress(Math.min(95, got / total * 100)); ctl.enqueue(chunk); } }));
      msg.textContent = tx.download;
      return new Response(body, { headers: { 'content-type': 'application/wasm' } });
    }
    const fatal = document.getElementById('fatal');
    const fatalButton = document.getElementById('fatalbtn');
    fatalButton.textContent = tx.reload;
    fatalButton.addEventListener('click', () => location.reload());
    const showFatal = (err, message = tx.fatal) => {
      console.error(err);
      if (fatal.classList.contains('on')) return;
      document.getElementById('fataltx').textContent = message;
      fatal.classList.add('on');
      fatalButton.focus();
    };
    // The wasm build aborts on the first Rust panic; the hook in src/panic_report.rs hands the message here so the
    // overlay names the real cause instead of "ran out of memory or hit an internal error".
    window.ume_panic = (text) => showFatal(new Error(text), `${tx.fatal} (${text})`);
    let ume;
    try {
const blocked = window.umePreflight && window.umePreflight(navigator.language);
if (blocked) throw Object.assign(new Error(blocked), { preflight: true });
ume = await import('./ultimate-mugen.js?v=__BUILD__');
await ume.default({ module_or_path: await load().catch(() => new URL('./ultimate-mugen_bg.wasm?v=__BUILD__', import.meta.url)) });
} catch (e) {
  boot.remove();
  showFatal(e, e && e.preflight ? e.message : `${tx.fail}: ${e && e.message ? e.message : e}`);
}
if (ume && !fatal.classList.contains('on')) {
  barBox.classList.remove('ind');
  setProgress(100);
  window.umeStartImports(ume);
  window.umeStartMarket(ume);
  for (const t of ['pointerdown', 'keydown', 'touchend']) window.addEventListener(t, () => ume.ume_unlock_audio(), { capture: true, passive: true });
  setTimeout(hide, 600);
  const cv = document.getElementById('glcanvas');
  window.addEventListener('error', (e) => showFatal(e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => showFatal(e.reason));
  const LOST_KEY = 'ume-ctx-lost', LOST_WINDOW_MS = 60000, LOST_LIMIT = 3;
  const recentLosses = () => { try { return JSON.parse(sessionStorage.getItem(LOST_KEY) || '[]').filter((t) => Date.now() - t < LOST_WINDOW_MS); } catch (e) { return []; } };
  cv.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    const losses = recentLosses();
    if (losses.length >= LOST_LIMIT) { showFatal(new Error('WebGL context lost ' + LOST_LIMIT + ' times in a minute')); return; }
    try { sessionStorage.setItem(LOST_KEY, JSON.stringify([...losses, Date.now()])); } catch (err) {}
    msg.textContent = tx.lost; boot.classList.remove('done'); document.body.appendChild(boot); setTimeout(() => location.reload(), 800);
  });
}
  </script>
  <script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
